{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ms.fullname" $ctx }}
  labels:
    {{- include "ms.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ms.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http    # ServiceMonitor (monitoring/) scrapes this named port
      port: {{ $svc.port }}
      targetPort: http
{{- end }}
