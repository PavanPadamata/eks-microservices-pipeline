{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ms.fullname" $ctx }}
  labels:
    {{- include "ms.labels" $ctx | nindent 4 }}
data:
  {{- range $key, $value := $svc.env }}
  {{ $key }}: {{ tpl (toString $value) $ | quote }}
  {{- end }}
{{- end }}
