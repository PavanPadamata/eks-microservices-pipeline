{{- if .Values.ingress.enabled }}
{{- $target := get .Values.services .Values.ingress.service }}
{{- $ctx := dict "root" $ "name" .Values.ingress.service "svc" $target }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "ms.labels" $ctx | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ms.fullname" $ctx }}
                port:
                  name: http
{{- end }}
