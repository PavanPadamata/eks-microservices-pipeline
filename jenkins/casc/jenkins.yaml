# Jenkins Configuration as Code. No secrets here: the admin password comes from the environment
# and the kubeconfig is read from a file that is generated locally and gitignored.
jenkins:
  systemMessage: "Local Jenkins for eks-microservices-pipeline"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: http://localhost:8081/

credentials:
  system:
    domainCredentials:
      - credentials:
          - file:
              scope: GLOBAL
              id: kind-kubeconfig
              description: kubeconfig for the local kind cluster (generated by `make jenkins-kubeconfig`)
              fileName: kubeconfig
              secretBytes: "${base64:${readFile:/run/secrets/kubeconfig}}"
          # AWS credentials for TARGET=eks are NOT created here; add `aws-credentials`
          # (Username with password: access key id / secret) in the Jenkins UI. See README.

jobs:
  - script: >
      pipelineJob('eks-microservices-pipeline') {
        description('Builds, pushes/loads and deploys api + worker. Source: the repo bind-mounted at /repo.')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('file:///repo') }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
