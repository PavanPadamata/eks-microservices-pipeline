# Example alert rules. Thresholds are illustrative defaults, not tuned SLOs.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: microservices
  labels:
    app.kubernetes.io/part-of: microservices
spec:
  groups:
    - name: microservices.rules
      rules:
        - alert: MicroservicesHighErrorRate
          expr: |
            sum by (service) (rate(http_requests_total{namespace="microservices", status=~"5.."}[5m]))
              / sum by (service) (rate(http_requests_total{namespace="microservices"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }}: more than 5% of requests return 5xx"
            description: "5xx ratio over the last 5m has been above 5% for 5 minutes."
        - alert: MicroservicesHighP95Latency
          expr: |
            histogram_quantile(0.95,
              sum by (le, service) (rate(http_request_duration_seconds_bucket{namespace="microservices"}[5m]))
            ) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }}: p95 latency above 500ms"
            description: "p95 request latency over the last 5m has been above 0.5s for 5 minutes."
